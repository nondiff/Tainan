<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>台南雙人小旅行｜旅遊手帳</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK (Compat Version for Web) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <!-- Google Fonts: Plus Jakarta Sans & Noto Sans TC -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --bg-cream: #F5F3EB;
            --card-white: #FFFFFF;
            --ink-dark: #222222;
            --accent-yellow: #F6D365;
            --soft-pink: #F8EAE8;
            --soft-mint: #E3EFE0;
            --sky-blue: #CBE2F6;
        }

        body {
            background-color: #EAE6DA;
            font-family: 'Plus Jakarta Sans', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--ink-dark);
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        .app-shell {
            max-width: 440px;
            min-height: 100vh;
            margin: 0 auto;
            background-color: var(--bg-cream);
            position: relative;
            box-shadow: 0 0 0 2px #222222;
        }

        @media (min-width: 460px) {
            body {
                padding: 12px 0;
            }

            .app-shell {
                min-height: calc(100vh - 24px);
                border-radius: 32px;
                overflow-x: hidden;
            }
        }

        .hb-card {
            background-color: #FFFFFF;
            border: 2px solid #222222;
            border-radius: 20px;
        }

        .hb-pill {
            border: 1.5px solid #222222;
            border-radius: 9999px;
        }

        .hb-btn {
            transition: transform 0.1s ease, background-color 0.15s ease, box-shadow 0.15s ease;
            cursor: pointer;
        }

        .hb-btn:active {
            transform: scale(0.96);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body>
    <div class="app-shell flex flex-col pb-8" id="app">
        <!-- Top 3-Tab Navigation Bar (精簡為三大核心頁籤) -->
        <header class="sticky top-0 z-30 bg-[#F5F3EB]/95 backdrop-blur-sm pt-3 px-3 pb-2">
            <nav aria-label="主導覽列"
                class="bg-white border-2 border-[#222222] rounded-[22px] p-1.5 grid grid-cols-3 gap-1.5 shadow-sm">
                <button onclick="switchTab('itinerary')" data-tab="itinerary"
                    class="nav-tab hb-btn flex items-center justify-center gap-1.5 py-2 px-2 rounded-[16px] border-2 border-transparent transition-all">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="18" rx="3"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                    <span class="text-xs font-black tracking-tight">行程表</span>
                </button>

                <button onclick="switchTab('spots')" data-tab="spots"
                    class="nav-tab hb-btn flex items-center justify-center gap-1.5 py-2 px-2 rounded-[16px] border-2 border-transparent transition-all">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                    </svg>
                    <span class="text-xs font-black tracking-tight">口袋景點</span>
                </button>

                <button onclick="switchTab('memo')" data-tab="memo"
                    class="nav-tab hb-btn flex items-center justify-center gap-1.5 py-2 px-2 rounded-[16px] border-2 border-transparent transition-all">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                        <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                    </svg>
                    <span class="text-xs font-black tracking-tight">住宿・清單</span>
                </button>
            </nav>
        </header>

        <!-- Main Content Container -->
        <main id="main-content" class="px-3.5 pt-1 flex-1 space-y-3.5"></main>

        <!-- Toast Notification Banner -->
        <div id="toast"
            class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-all duration-200 translate-y-2">
            <div
                class="bg-[#222222] text-white border-2 border-white px-4 py-2 rounded-full text-xs font-bold shadow-lg flex items-center gap-2 whitespace-nowrap">
                <span id="toast-icon">✅</span>
                <span id="toast-text">已更新</span>
            </div>
        </div>

        <!-- Edit Trip Modal -->
        <div id="edit-modal"
            class="fixed inset-0 z-50 bg-black/40 backdrop-blur-[1px] hidden items-center justify-center p-4">
            <div class="bg-white border-2 border-[#222222] rounded-[24px] w-full max-w-[390px] p-5 space-y-4">
                <div class="flex items-center justify-between">
                    <h3 class="text-lg font-black flex items-center gap-1.5">✏️ 編輯旅遊資訊</h3>
                    <button onclick="closeEditModal()"
                        class="w-8 h-8 rounded-full border-2 border-[#222222] flex items-center justify-center font-black text-sm hb-btn">✕</button>
                </div>
                <div class="space-y-3 text-xs font-bold">
                    <div>
                        <label class="block mb-1 text-[#555555]">旅遊標題</label>
                        <input id="edit-title" type="text"
                            class="w-full border-2 border-[#222222] rounded-xl px-3 py-2 text-sm font-bold focus:outline-none focus:bg-[#FFFDF5]" />
                    </div>
                    <div>
                        <label class="block mb-1 text-[#555555]">日期副標題</label>
                        <input id="edit-subtitle" type="text"
                            class="w-full border-2 border-[#222222] rounded-xl px-3 py-2 text-sm font-bold focus:outline-none focus:bg-[#FFFDF5]" />
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block mb-1 text-[#555555]">地區標籤</label>
                            <input id="edit-regions" type="text"
                                class="w-full border-2 border-[#222222] rounded-xl px-3 py-2 text-xs font-bold focus:outline-none focus:bg-[#FFFDF5]" />
                        </div>
                        <div>
                            <label class="block mb-1 text-[#555555]">成員標籤</label>
                            <input id="edit-travelers" type="text"
                                class="w-full border-2 border-[#222222] rounded-xl px-3 py-2 text-xs font-bold focus:outline-none focus:bg-[#FFFDF5]" />
                        </div>
                    </div>
                    <div>
                        <label class="block mb-1 text-[#555555]">個人備忘提醒</label>
                        <input id="edit-memo" type="text"
                            class="w-full border-2 border-[#222222] rounded-xl px-3 py-2 text-xs font-bold focus:outline-none focus:bg-[#FFFDF5]" />
                    </div>
                </div>
                <div class="flex gap-2 pt-1">
                    <button onclick="resetTripMeta()"
                        class="flex-1 py-2.5 rounded-xl border-2 border-[#222222] bg-[#F5F3EB] text-xs font-black hb-btn">恢復預設</button>
                    <button onclick="saveTripMeta()"
                        class="flex-1 py-2.5 rounded-xl border-2 border-[#222222] bg-[#F6D365] text-xs font-black hb-btn">儲存變更</button>
                </div>
            </div>
        </div>

        <!-- Add Place of Interest Modal -->
        <div id="add-spot-modal"
            class="fixed inset-0 z-50 bg-black/40 backdrop-blur-[1px] hidden items-center justify-center p-4">
            <div class="bg-white border-2 border-[#222222] rounded-[24px] w-full max-w-[390px] max-h-[90vh] overflow-y-auto no-scrollbar p-5 space-y-3.5">
                <div class="flex items-center justify-between">
                    <h3 class="text-base font-black flex items-center gap-1.5">➕ 新增想去的地點</h3>
                    <button onclick="closeAddSpotModal()"
                        class="w-8 h-8 rounded-full border-2 border-[#222222] flex items-center justify-center font-black text-sm hb-btn">✕</button>
                </div>
                <div class="space-y-2.5 text-xs font-bold">
                    <div>
                        <label class="block mb-1 text-[#555555]">地點名稱 <span class="text-red-500">*</span></label>
                        <input id="new-spot-name" type="text" placeholder="例：文章牛肉湯、林百貨、觀夕平台"
                            class="w-full border-2 border-[#222222] rounded-xl px-3 py-2 text-xs font-bold focus:outline-none focus:bg-[#FFFDF5]" />
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block mb-1 text-[#555555]">分類類型</label>
                            <select id="new-spot-category"
                                class="w-full border-2 border-[#222222] rounded-xl px-2.5 py-2 text-xs font-bold bg-white focus:outline-none">
                                <option value="food">🍜 美食小吃</option>
                                <option value="spot">⛩️ 景點古蹟</option>
                                <option value="cafe">☕ 甜點咖啡</option>
                                <option value="shopping">🛍️ 伴手禮購物</option>
                                <option value="hotel">🏨 住宿/放行李</option>
                                <option value="transport">🛵 租車交通</option>
                            </select>
                        </div>
                        <div>
                            <label class="block mb-1 text-[#555555]">所在區域</label>
                            <select id="new-spot-district"
                                class="w-full border-2 border-[#222222] rounded-xl px-2.5 py-2 text-xs font-bold bg-white focus:outline-none">
                                <option value="北區">北區 (近轉運站)</option>
                                <option value="中西區">中西區 (國華街/赤崁)</option>
                                <option value="安平區">安平區 (老街/海邊)</option>
                                <option value="東區">東區</option>
                                <option value="南區">南區</option>
                                <option value="其它">其它區域</option>
                            </select>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block mb-1 text-[#555555]">營業/開放時間</label>
                            <input id="new-spot-hours" type="text" placeholder="例：10:00 - 21:00 或 24H"
                                class="w-full border-2 border-[#222222] rounded-xl px-3 py-2 text-xs font-bold focus:outline-none focus:bg-[#FFFDF5]" />
                        </div>
                        <div>
                            <label class="block mb-1 text-[#555555]">預計停留時間</label>
                            <input id="new-spot-stay" type="text" placeholder="例：45分鐘 或 1小時"
                                class="w-full border-2 border-[#222222] rounded-xl px-3 py-2 text-xs font-bold focus:outline-none focus:bg-[#FFFDF5]" />
                        </div>
                    </div>
                    <div>
                        <label class="block mb-1 text-[#555555]">推薦特色／必點小撇步</label>
                        <input id="new-spot-tip" type="text" placeholder="例：必點招牌牛肉湯、二樓看夕陽"
                            class="w-full border-2 border-[#222222] rounded-xl px-3 py-2 text-xs font-bold focus:outline-none focus:bg-[#FFFDF5]" />
                    </div>
                    <div>
                        <label class="block mb-1 text-[#555555]">雨天／人潮備案</label>
                        <input id="new-spot-backup" type="text" placeholder="例：若排隊過長改去二店或咖啡店"
                            class="w-full border-2 border-[#222222] rounded-xl px-3 py-2 text-xs font-bold focus:outline-none focus:bg-[#FFFDF5]" />
                    </div>
                    <div>
                        <label class="block mb-1 text-[#555555]">加入至哪個行程時段？</label>
                        <select id="new-spot-target-slot"
                            class="w-full border-2 border-[#222222] rounded-xl px-2.5 py-2 text-xs font-bold bg-[#FFFDF5] focus:outline-none">
                            <option value="saved">⭐ 僅存入口袋名單（隨時挑選）</option>
                            <option value="am1">☀️ Day 1 早上行程</option>
                            <option value="pm1">🌊 Day 1 下午行程</option>
                            <option value="day2">🗓️ Day 2 行程</option>
                        </select>
                    </div>
                </div>
                <div class="flex gap-2 pt-1">
                    <button onclick="closeAddSpotModal()"
                        class="flex-1 py-2.5 rounded-xl border-2 border-[#222222] bg-[#F5F3EB] text-xs font-black hb-btn">取消</button>
                    <button onclick="saveNewSpot()"
                        class="flex-1 py-2.5 rounded-xl border-2 border-[#222222] bg-[#F6D365] text-xs font-black hb-btn">儲存地點</button>
                </div>
            </div>
        </div>

        <!-- Smart Route Optimization Modal -->
        <div id="optimize-modal"
            class="fixed inset-0 z-50 bg-black/40 backdrop-blur-[1px] hidden items-center justify-center p-4">
            <div class="bg-white border-2 border-[#222222] rounded-[24px] w-full max-w-[390px] max-h-[90vh] overflow-y-auto no-scrollbar p-5 space-y-4">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-1.5">
                        <span class="text-xl">✨</span>
                        <h3 class="text-base font-black text-[#222222]">智慧最佳遊玩順序推薦</h3>
                    </div>
                    <button onclick="closeOptimizeModal()"
                        class="w-8 h-8 rounded-full border-2 border-[#222222] flex items-center justify-center font-black text-sm hb-btn">✕</button>
                </div>

                <div id="optimize-summary-box" class="bg-[#FFF9E6] border-2 border-[#222222] rounded-2xl p-3.5 space-y-2 text-xs">
                    <!-- Injected dynamically -->
                </div>

                <div class="space-y-2">
                    <div class="flex items-center justify-between text-xs font-black text-[#555555]">
                        <span>📋 建議最佳遊玩路線</span>
                        <span class="text-[10px] bg-[#E3EFE0] hb-pill px-2 py-0.5 text-[#222222]">順向動線・省時</span>
                    </div>
                    <div id="optimize-preview-list" class="space-y-1.5 text-xs font-bold max-h-56 overflow-y-auto no-scrollbar">
                        <!-- Injected dynamically -->
                    </div>
                </div>

                <div class="flex gap-2 pt-1">
                    <button onclick="closeOptimizeModal()"
                        class="flex-1 py-2.5 rounded-xl border-2 border-[#222222] bg-[#F5F3EB] text-xs font-black hb-btn">保持原順序</button>
                    <button onclick="applyOptimizedOrder()"
                        class="flex-1 py-2.5 rounded-xl border-2 border-[#222222] bg-[#F6D365] text-xs font-black hb-btn flex items-center justify-center gap-1">
                        <span>✅</span>
                        <span>套用此順序</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Stop Expense Modal -->
        <div id="stop-expense-modal"
            class="fixed inset-0 z-50 bg-black/40 backdrop-blur-[1px] hidden items-center justify-center p-4">
            <div class="bg-white border-2 border-[#222222] rounded-[24px] w-full max-w-[390px] max-h-[90vh] overflow-y-auto no-scrollbar p-5 space-y-4">
                <div class="flex items-center justify-between">
                    <div>
                        <div class="text-[11px] font-black text-[#888888]">景點記帳</div>
                        <h3 id="stop-expense-title" class="text-base font-black text-[#222222] leading-tight line-clamp-1"></h3>
                    </div>
                    <button onclick="closeStopExpenseModal()"
                        class="w-8 h-8 rounded-full border-2 border-[#222222] flex items-center justify-center font-black text-sm hb-btn">✕</button>
                </div>

                <!-- Spot Current Total Badge -->
                <div class="bg-[#F8EAE8] border-2 border-[#222222] rounded-2xl p-3 flex items-center justify-between">
                    <span class="text-xs font-black text-[#222222]">本站累積支出</span>
                    <span id="stop-expense-total-display" class="text-lg font-black text-[#222222] tabular-nums">NT$ 0</span>
                </div>

                <!-- Quick Add Form -->
                <div class="bg-[#F5F3EB] border-[1.5px] border-[#222222] rounded-2xl p-3 space-y-2.5">
                    <div class="text-xs font-black text-[#222222]">＋ 記一筆花費</div>
                    <!-- Quick Tag Chips -->
                    <div class="flex items-center gap-1 flex-wrap">
                        <button type="button" onclick="setQuickExpCategory('🥣 餐費')" class="hb-btn bg-white border border-[#222222] rounded-full px-2 py-0.5 text-[10px] font-black">🥣 餐費</button>
                        <button type="button" onclick="setQuickExpCategory('🥤 飲料甜點')" class="hb-btn bg-white border border-[#222222] rounded-full px-2 py-0.5 text-[10px] font-black">🥤 飲料甜點</button>
                        <button type="button" onclick="setQuickExpCategory('🛵 租車交通')" class="hb-btn bg-white border border-[#222222] rounded-full px-2 py-0.5 text-[10px] font-black">🛵 租車交通</button>
                        <button type="button" onclick="setQuickExpCategory('🎫 門票')" class="hb-btn bg-white border border-[#222222] rounded-full px-2 py-0.5 text-[10px] font-black">🎫 門票</button>
                        <button type="button" onclick="setQuickExpCategory('🛍️ 伴手禮')" class="hb-btn bg-white border border-[#222222] rounded-full px-2 py-0.5 text-[10px] font-black">🛍️ 伴手禮</button>
                    </div>
                    <div class="grid grid-cols-5 gap-2">
                        <input id="stop-exp-input-name" type="text" placeholder="項目（例：牛肉湯兩碗）"
                            class="col-span-3 border-[1.5px] border-[#222222] rounded-xl px-2.5 py-1.5 text-xs font-bold bg-white focus:outline-none" />
                        <input id="stop-exp-input-amount" type="number" placeholder="金額"
                            class="col-span-2 border-[1.5px] border-[#222222] rounded-xl px-2 py-1.5 text-xs font-bold bg-white focus:outline-none text-right" />
                    </div>
                    <button onclick="saveStopExpenseItem()"
                        class="w-full py-2 rounded-xl border-[1.5px] border-[#222222] bg-[#F6D365] text-xs font-black hb-btn">
                        ＋ 加入支出紀錄
                    </button>
                </div>

                <!-- Expense Items List -->
                <div class="space-y-2">
                    <div class="text-xs font-black text-[#555555]">本站消費明細</div>
                    <div id="stop-expense-items-list" class="space-y-1.5 max-h-48 overflow-y-auto no-scrollbar">
                        <!-- Injected dynamically -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Global Expense Summary Modal -->
        <div id="global-expense-modal"
            class="fixed inset-0 z-50 bg-black/40 backdrop-blur-[1px] hidden items-center justify-center p-4">
            <div class="bg-white border-2 border-[#222222] rounded-[24px] w-full max-w-[390px] max-h-[90vh] overflow-y-auto no-scrollbar p-5 space-y-4">
                <div class="flex items-center justify-between">
                    <div>
                        <h3 class="text-lg font-black text-[#222222] flex items-center gap-1.5">
                            <span>📊</span>
                            <span>台南小旅行・旅費總覽</span>
                        </h3>
                    </div>
                    <button onclick="closeGlobalExpenseModal()"
                        class="w-8 h-8 rounded-full border-2 border-[#222222] flex items-center justify-center font-black text-sm hb-btn">✕</button>
                </div>

                <div id="global-expense-content" class="space-y-3.5">
                    <!-- Injected dynamically -->
                </div>
            </div>
        </div>

        <!-- Pick From Saved Spots Modal -->
        <div id="pick-spot-modal"
            class="fixed inset-0 z-50 bg-black/40 backdrop-blur-[1px] hidden items-center justify-center p-4">
            <div class="bg-white border-2 border-[#222222] rounded-[24px] w-full max-w-[390px] max-h-[90vh] overflow-y-auto no-scrollbar p-5 space-y-3.5">
                <div class="flex items-center justify-between">
                    <div>
                        <h3 class="text-base font-black text-[#222222]">從口袋名單挑選加入</h3>
                        <p id="pick-spot-subtitle" class="text-[11px] font-bold text-[#666666]"></p>
                    </div>
                    <button onclick="closePickSpotModal()"
                        class="w-8 h-8 rounded-full border-2 border-[#222222] flex items-center justify-center font-black text-sm hb-btn">✕</button>
                </div>

                <div id="pick-spot-list" class="space-y-2 max-h-[60vh] overflow-y-auto no-scrollbar">
                    <!-- Injected dynamically -->
                </div>

                <div class="pt-1">
                    <button onclick="closePickSpotModal(); openAddSpotModal(currentPickSlot);"
                        class="w-full py-2.5 rounded-xl border-2 border-[#222222] bg-[#F5F3EB] text-xs font-black hb-btn flex items-center justify-center gap-1">
                        <span>➕</span>
                        <span>新增全新自訂地點</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 0. FIREBASE REALTIME DATABASE CONFIG & SYNC
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyCVeXzqBURwLSriTzHR55yXWTmIaaM3Hlw",

        let db = null;

        try {

        function updateCloudStatus(status) {
            const badge = document.getElementById('cloud-status-badge');
            const dot = document.getElementById('cloud-status-dot');
            const text = document.getElementById('cloud-status-text');
            if (!badge || !dot || !text) return;

            switch (status) {
                case 'synced':
                    dot.className = 'w-1.5 h-1.5 rounded-full bg-emerald-500';
                    text.textContent = '雲端已同步';
                    badge.className = 'hb-pill px-2.5 py-0.5 text-[10px] font-black bg-[#E3EFE0] text-[#1e5424] flex items-center gap-1 shadow-sm';
                    break;
                case 'saving':
                    dot.className = 'w-1.5 h-1.5 rounded-full bg-amber-500 animate-ping';
                    text.textContent = '同步中...';
                    badge.className = 'hb-pill px-2.5 py-0.5 text-[10px] font-black bg-[#FFF9E6] text-[#855e10] flex items-center gap-1 shadow-sm';
                    break;
                case 'connecting':
                    dot.className = 'w-1.5 h-1.5 rounded-full bg-blue-500 animate-pulse';
                    text.textContent = '雲端連線中';
                    badge.className = 'hb-pill px-2.5 py-0.5 text-[10px] font-black bg-[#CBE2F6] text-[#1c4467] flex items-center gap-1 shadow-sm';
                    break;
                case 'error':
                    dot.className = 'w-1.5 h-1.5 rounded-full bg-rose-500';
                    text.textContent = '離線暫存';
                    badge.className = 'hb-pill px-2.5 py-0.5 text-[10px] font-black bg-[#F8EAE8] text-[#9e2a2b] flex items-center gap-1 shadow-sm';
                    break;
                default:
                    dot.className = 'w-1.5 h-1.5 rounded-full bg-gray-400';
                    text.textContent = '本機模式';
                    badge.className = 'hb-pill px-2.5 py-0.5 text-[10px] font-black bg-[#F5F3EB] text-[#555555] flex items-center gap-1 shadow-sm';
                    break;
            }
        }

        function initCloudSync() {
            if (!tripRef) {
                updateCloudStatus('offline');
                return;
            }

            updateCloudStatus('connecting');

            tripRef.on('value', snapshot => {
                const cloudData = snapshot.val();
                if (cloudData) {
                    isReceivingCloudUpdate = true;
                    if (cloudData.tripMeta) state.tripMeta = cloudData.tripMeta;
                    if (cloudData.checkedStops) state.checkedStops = cloudData.checkedStops;
                    if (cloudData.stopNotes) state.stopNotes = cloudData.stopNotes;
                    if (cloudData.checklist) state.checklist = cloudData.checklist;
                    if (cloudData.parkingInfo !== undefined) state.parkingInfo = cloudData.parkingInfo;
                    if (cloudData.scooterInfo !== undefined) state.scooterInfo = cloudData.scooterInfo;
                    if (cloudData.hotelInfo !== undefined) state.hotelInfo = cloudData.hotelInfo;
                    if (cloudData.scheduleSlots) state.scheduleSlots = cloudData.scheduleSlots;
                    if (cloudData.savedSpots) state.savedSpots = cloudData.savedSpots;
                    if (cloudData.expenses) state.expenses = cloudData.expenses;

                    saveLocalState();
                    renderCurrentTab();
                    isReceivingCloudUpdate = false;
                    updateCloudStatus('synced');
                } else {
                    saveState(false, true);
                }
            }, err => {
                console.error('Firebase listen error:', err);
                updateCloudStatus('error');
            });
        }

        function saveState(skipCloud = false, forceCloud = false) {
            saveLocalState();
            if ((!forceCloud && (isReceivingCloudUpdate || skipCloud)) || !tripRef) return;

            updateCloudStatus('saving');
            clearTimeout(cloudSaveTimer);
            cloudSaveTimer = setTimeout(() => {
                const payload = {
                    tripMeta: state.tripMeta,
                    checkedStops: state.checkedStops,
                    stopNotes: state.stopNotes,
                    checklist: state.checklist,
                    parkingInfo: state.parkingInfo,
                    scooterInfo: state.scooterInfo,

                    scheduleSlots: state.scheduleSlots,
                    savedSpots: state.savedSpots,
                    expenses: state.expenses,
                    updatedAt: Date.now()
                };

                tripRef.set(payload)
                    .then(() => {
                        updateCloudStatus('synced');
                    })
                    .catch(err => {
                        console.error('Cloud save failed:', err);
                        updateCloudStatus('error');
                    });
            }, 300);
        }

        function getStopExpenses(stopId) {
            return state.expenses[stopId] || [];
        }

        function getStopTotalExpense(stopId) {
            const list = getStopExpenses(stopId);
            return list.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
        }

        function getGrandTotalExpense() {
            let total = 0;
            let count = 0;
            const byCategory = {
                food: 0,
                transport: 0,
                hotel: 0,
                ticket: 0,
                shopping: 0,
                other: 0
            };

            Object.entries(state.expenses).forEach(([stopId, list]) => {
                if (Array.isArray(list)) {
                    list.forEach(item => {
                        const amt = Number(item.amount) || 0;
                        total += amt;
                        count++;
                        const cat = item.category || 'other';
                        if (byCategory[cat] !== undefined) {
                            byCategory[cat] += amt;
                        } else {
                            byCategory.other += amt;
                        }
                    });
                }
            });

            return {
                total,
                count,
                perPerson: Math.round(total / 2),
                byCategory
            };
        }

        function saveStopExpenseItem() {
            if (!currentExpenseStopId) return;
            const nameInput = document.getElementById('stop-exp-input-name');
            const amtInput = document.getElementById('stop-exp-input-amount');
            const title = (nameInput.value || '').trim() || '一般消費';
            const amount = parseFloat(amtInput.value);

            if (isNaN(amount) || amount <= 0) {
                showToast('請輸入有效金額', '⚠️');
                return;
            }

            let cat = 'other';
            if (title.includes('餐') || title.includes('湯') || title.includes('吃') || title.includes('飯') || title.includes('肉') || title.includes('麵') || title.includes('豆花') || title.includes('食') || title.includes('茶') || title.includes('甜點')) {
                cat = 'food';
            } else if (title.includes('車') || title.includes('油') || title.includes('停') || title.includes('租') || title.includes('票') || title.includes('高鐵')) {
                cat = 'transport';

        // 4. SMART ROUTE OPTIMIZATION

        let optimizedPreviewItems = [];

        function calculateItemScore(item, slotKey) {
            const title = (item.title || '') + ' ' + (item.desc || '') + ' ' + (item.tags || []).join(' ');
            const district = item.district || inferDistrict(title);
            const hours = item.openHours || inferOpenHours(title);

            let score = 50;

            if (title.includes('停車') || title.includes('抵達')) return -100;
            if (title.includes('早餐') || title.includes('牛肉湯')) score = -40;
            if (title.includes('廟宇') || title.includes('玉皇宮') || title.includes('參拜')) score = -30;
            if (title.includes('租機車') || title.includes('租車')) score = -15;
            if (title.includes('廣發寓所') || title.includes('放行李') || item.category === 'hotel') score = -5;
            if (title.includes('去安平') || title.includes('前往安平')) score = 10;
            if (title.includes('夕陽') || title.includes('觀夕') || title.includes('日落')) score = 80;
            if (title.includes('夜市') || title.includes('宵夜') || title.includes('酒吧')) score = 95;
            if (title.includes('還車') || title.includes('取車返程') || title.includes('返程')) return 100;

            if (slotKey === 'am1') {
                if (district === '北區') score -= 20;
                else if (district === '中西區') score += 5;
                else if (district === '安平區') score += 30;
            } else if (slotKey === 'pm1') {
                if (district === '安平區') {
                    if (title.includes('夕陽') || title.includes('海邊')) score += 20;
                    else score -= 10;
                } else if (district === '中西區') {
                    score += 25;
                }
            } else if (slotKey === 'day2') {
                if (district === '中西區') score -= 15;
                if (title.includes('伴手禮')) score += 10;
                if (district === '北區') score += 30;
            }

            if (hours.includes('04:') || hours.includes('05:') || hours.includes('06:') || hours.includes('早市')) {
                score -= 30;
            } else if (hours.includes('16:') || hours.includes('17:') || hours.includes('夕陽')) {
                score += 25;
            } else if (hours.includes('18:') || hours.includes('19:') || hours.includes('夜市')) {
                score += 40;
            }

            return score;
        }

        function inferDistrict(text) {
            if (text.includes('安平') || text.includes('觀夕') || text.includes('億載')) return '安平區';
            if (text.includes('赤崁') || text.includes('國華') || text.includes('神農') || text.includes('廣發') || text.includes('孔廟') || text.includes('林百貨')) return '中西區';
            if (text.includes('轉運站') || text.includes('玉皇宮') || text.includes('西羅殿') || text.includes('無名豆花') || text.includes('見昌')) return '北區';
            return '中西區';
        }

        function inferOpenHours(text) {
            if (text.includes('早餐') || text.includes('西羅殿')) return '04:30 - 13:00';
            if (text.includes('夕陽') || text.includes('觀夕')) return '16:30 - 17:40';
            if (text.includes('夜市')) return '18:00 - 23:30';
            return '10:00 - 19:00';
        }

                    time: `第${['一','二','三','四','五','六','七','八','九','十'][slotItems.length] || (slotItems.length+1)}站・${newSpot.tag.slice(2)}`,

                    desc: `${newSpot.tip}（營業時間：${newSpot.openHours}）`,
                    tags: [`📍 ${newSpot.district}`, newSpot.tag],
                    mapQuery: newSpot.mapQuery,
                    district: newSpot.district,
                    openHours: newSpot.openHours,
                    category: newSpot.category,
                    isCustom: true
                });
            }

            saveState();
            closeAddSpotModal();
            renderCurrentTab();
            showToast(`已加入「${name}」！`, '🎉');
        }

        function deleteCustomSpot(spotId) {
            if (!confirm('確定要從口袋名單中刪除此地點嗎？')) return;
            state.savedSpots = state.savedSpots.filter(s => s.id !== spotId);
            saveState();
            renderCurrentTab();
            showToast('已刪除收藏地點');
        }

        function openPickSpotModal(slotKey) {
            currentPickSlot = slotKey;
            const modal = document.getElementById('pick-spot-modal');
            const subtitle = document.getElementById('pick-spot-subtitle');
            const listEl = document.getElementById('pick-spot-list');

            const slot = state.scheduleSlots[slotKey];
            subtitle.textContent = `加入至：${slot ? slot.slotLabel : slotKey}`;

            const existingNames = new Set((slot ? slot.items : []).map(i => i.title));

            if (state.savedSpots.length === 0) {
                listEl.innerHTML = `<div class="text-center py-6 text-xs text-[#888888]">目前口袋名單是空的，點下方按鈕新增！</div>`;
            } else {
                listEl.innerHTML = state.savedSpots.map(spot => {
                    const alreadyIn = existingNames.has(spot.name);
                    return `
                        <div class="flex items-center justify-between p-3 rounded-2xl border-2 ${alreadyIn ? 'bg-[#F5F3EB] border-[#222222]/30 opacity-70' : 'bg-white border-[#222222]'}">
                            <div class="space-y-0.5 min-w-0 pr-2">
                                <div class="flex items-center gap-1.5 flex-wrap">

                                    <span class="text-[10px] px-2 py-0.5 rounded-full font-black" style="background-color: ${spot.color};">${spot.tag}</span>
                                </div>
                                <div class="text-[11px] font-bold text-[#666666]">
                                    📍 ${spot.district} ｜ ⏰ ${spot.openHours}

                            </div>
                            <button onclick="addSavedSpotToSlot('${spot.id}', '${slotKey}')" ${alreadyIn ? 'disabled' : ''} class="hb-btn px-3 py-1.5 rounded-xl border-2 border-[#222222] text-xs font-black shrink-0 ${alreadyIn ? 'bg-gray-200 text-gray-500 cursor-not-allowed' : 'bg-[#F6D365] text-[#222222]'}">

                            </button>
                        </div>

                }).join('');

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closePickSpotModal() {
            const modal = document.getElementById('pick-spot-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function addSavedSpotToSlot(spotId, slotKey) {
            const spot = state.savedSpots.find(s => s.id === spotId);
            if (!spot || !state.scheduleSlots[slotKey]) return;

            const slotItems = state.scheduleSlots[slotKey].items;
            const newId = 'stop_' + Date.now();
            slotItems.push({
                id: newId,
                time: `第${['一','二','三','四','五','六','七','八','九','十'][slotItems.length] || (slotItems.length+1)}站・${spot.tag.slice(2)}`,
                title: spot.name,
                desc: `${spot.tip}（營業時間：${spot.openHours}）`,
                tags: [`📍 ${spot.district}`, spot.tag],
                mapQuery: spot.mapQuery,
                district: spot.district,
                openHours: spot.openHours,
                category: spot.category,
                isCustom: true
            });

            saveState();
            closePickSpotModal();
            renderCurrentTab();
            showToast(`已將「${spot.name}」加入 ${state.scheduleSlots[slotKey].slotLabel}！`, '✅');
        }

        function filterSpots(cat) {
            state.spotFilter = cat;
            renderCurrentTab();
        }

            <span>新增此時段新景點</span>

            </div>
          </div>

          <!-- Quick Add Input -->
          <div class="hb-card p-2.5 flex items-center gap-2">
            <input id="new-check-input" type="text" placeholder="新增清單項目（例：雨衣、行動電源）" class="flex-1 text-xs font-bold bg-[#F5F3EB] border-[1.5px] border-[#222222] rounded-xl px-3 py-1.5 focus:outline-none" onkeydown="if(event.key==='Enter') addCheckItem()" />
            <button onclick="addCheckItem()" class="hb-btn bg-[#F6D365] border-[1.5px] border-[#222222] rounded-xl px-3 py-1.5 text-xs font-black shrink-0">＋ 加入</button>
          </div>

          <!-- Categories -->
          <div class="space-y-2.5">
            ${state.checklist.map((cat, cIdx) => `
              <div class="hb-card p-3 space-y-1.5">
                <h3 class="text-xs font-black text-[#222222] border-b border-[#222222]/20 pb-1">${cat.category}</h3>
                <div class="space-y-1">
                  ${cat.items.map((item, iIdx) => `
                    <label class="flex items-start gap-2 p-1.5 rounded-xl border ${item.done ? 'bg-[#F5F3EB] border-[#222222]/20' : 'bg-white border-[#222222]/40'} cursor-pointer">
                      <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleCheckItem(${cIdx}, ${iIdx})" class="mt-0.5 w-4 h-4 accent-[#222222]" />
                      <span class="text-xs font-bold flex-1 ${item.done ? 'line-through text-[#888888]' : 'text-[#222222]'}">${escapeHtml(item.text)}</span>
                    </label>
                  `).join('')}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
        }

        // ==========================================
        // 7. TAB & CONTROLLERS
        // ==========================================
        function switchTab(tabName) {
            state.activeTab = tabName;
            document.querySelectorAll('.nav-tab').forEach(btn => {
                const isTarget = btn.getAttribute('data-tab') === tabName;
                btn.style.backgroundColor = isTarget ? '#F6D365' : 'transparent';
                btn.style.borderColor = isTarget ? '#222222' : 'transparent';
            });
            renderCurrentTab();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderCurrentTab() {
            const container = document.getElementById('main-content');
            if (!container) return;
            switch (state.activeTab) {
                case 'itinerary':
                    container.innerHTML = renderItineraryTab();
                    break;
                case 'spots':
                    container.innerHTML = renderSpotsTab();
                    break;
                case 'memo':
                    container.innerHTML = renderMemoTab();
                    break;
                default:
                    container.innerHTML = renderItineraryTab();
                    break;
            }
        }

        function selectSlot(slotKey) {
            state.selectedSlot = slotKey;
            renderCurrentTab();
        }

        function toggleStopDone(id) {
            state.checkedStops[id] = !state.checkedStops[id];
            saveState();
            renderCurrentTab();
        }

        function toggleCheckItem(cIdx, iIdx) {
            state.checklist[cIdx].items[iIdx].done = !state.checklist[cIdx].items[iIdx].done;
            saveState();
            renderCurrentTab();
        }

        function addCheckItem() {
            const input = document.getElementById('new-check-input');
            const val = input ? input.value.trim() : '';
            if (!val) return;
            state.checklist[0].items.unshift({ id: 'c_' + Date.now(), text: val, done: false });
            saveState();
            renderCurrentTab();
            showToast('已加入清單');
        }

        function resetChecklist() {
            state.checklist = JSON.parse(JSON.stringify(DEFAULT_CHECKLIST));
            saveState();
            renderCurrentTab();
            showToast('已重置清單');
        }

        function openEditModal() {
            document.getElementById('edit-title').value = state.tripMeta.title;
            document.getElementById('edit-subtitle').value = state.tripMeta.subtitle;
            document.getElementById('edit-regions').value = state.tripMeta.regions;
            document.getElementById('edit-travelers').value = state.tripMeta.travelers;
            document.getElementById('edit-memo').value = state.tripMeta.memo || '';
            const modal = document.getElementById('edit-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeEditModal() {
            const modal = document.getElementById('edit-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function saveTripMeta() {
            state.tripMeta = {
                title: document.getElementById('edit-title').value.trim() || DEFAULT_META.title,
                subtitle: document.getElementById('edit-subtitle').value.trim() || DEFAULT_META.subtitle,
                regions: document.getElementById('edit-regions').value.trim() || DEFAULT_META.regions,
                travelers: document.getElementById('edit-travelers').value.trim() || DEFAULT_META.travelers,
                memo: document.getElementById('edit-memo').value.trim()
            };
            saveState();
            closeEditModal();
            renderCurrentTab();
            showToast('已更新旅遊手帳資訊');
        }

        function resetTripMeta() {
            state.tripMeta = { ...DEFAULT_META };
            saveState();
            closeEditModal();
            renderCurrentTab();
            showToast('已恢復預設設定');
        }

        window.onload = function () {
            switchTab('itinerary');
            initCloudSync();
        };
    </script>
</body>

</html>
