<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>台南雙人小旅行｜11/28 — 11/29 旅遊手帳</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Plus Jakarta Sans & Noto Sans TC -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --bg-cream: #F5F3EB;
            --card-white: #FFFFFF;
            --ink-dark: #222222;
            --accent-yellow: #F6D365;
            --soft-pink: #F8EAE8;
            --soft-mint: #E3EFE0;
            --sky-blue: #CBE2F6;
            --emergency-red: #E05252;
        }

        body {
            background-color: #EAE6DA;
            font-family: 'Plus Jakarta Sans', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--ink-dark);
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        .app-shell {
            max-width: 440px;
            min-height: 100vh;
            margin: 0 auto;
            background-color: var(--bg-cream);
            position: relative;
            box-shadow: 0 0 0 2px #222222;
        }

        @media (min-width: 460px) {
            body {
                padding: 12px 0;
            }

            .app-shell {
                min-height: calc(100vh - 24px);
                border-radius: 32px;
                overflow-x: hidden;
            }
        }

        .hb-card {
            background-color: #FFFFFF;
            border: 2px solid #222222;
            border-radius: 22px;
        }

        .hb-pill {
            border: 1.5px solid #222222;
            border-radius: 9999px;
        }

        .hb-btn {
            transition: transform 0.12s ease, background-color 0.15s ease, box-shadow 0.15s ease;
            cursor: pointer;
        }

        .hb-btn:active {
            transform: scale(0.96);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* ==========================================
       STORYBOOK SVG ANIMATIONS
       ========================================== */
        @keyframes spinSlow {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .sun-rays-spin {
            transform-origin: 332px 38px;
            animation: spinSlow 24s linear infinite;
        }

        @keyframes cloudDriftA {

            0%,
            100% {
                transform: translateX(0px);
            }

            50% {
                transform: translateX(10px);
            }
        }

        @keyframes cloudDriftB {

            0%,
            100% {
                transform: translateX(0px);
            }

            50% {
                transform: translateX(-10px);
            }
        }

        .cloud-drift-a {
            animation: cloudDriftA 7.5s ease-in-out infinite;
        }

        .cloud-drift-b {
            animation: cloudDriftB 8.5s ease-in-out infinite;
        }

        @keyframes palmSway {

            0%,
            100% {
                transform: rotate(-2.5deg);
            }

            50% {
                transform: rotate(3.5deg);
            }
        }

        .palm-sway {
            transform-origin: 54px 136px;
            animation: palmSway 3.8s ease-in-out infinite;
        }

        @keyframes scooterBounce {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-1.5px);
            }
        }

        .scooter-bounce {
            animation: scooterBounce 0.65s ease-in-out infinite;
        }

        @keyframes wheelSpin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .wheel-spin {
            transform-box: fill-box;
            transform-origin: center;
            animation: wheelSpin 1s linear infinite;
        }

        @keyframes waveShimmer {

            0%,
            100% {
                transform: translateX(0px);
                opacity: 0.85;
            }

            50% {
                transform: translateX(6px);
                opacity: 0.4;
            }
        }

        .wave-shimmer {
            animation: waveShimmer 3s ease-in-out infinite;
        }

        @keyframes rainFall {
            0% {
                transform: translate(0px, -12px);
                opacity: 0;
            }

            30% {
                opacity: 0.85;
            }

            100% {
                transform: translate(-12px, 34px);
                opacity: 0;
            }
        }

        .rain-drop-1 {
            animation: rainFall 1.1s linear infinite;
        }

        .rain-drop-2 {
            animation: rainFall 1.1s linear 0.35s infinite;
        }

        .rain-drop-3 {
            animation: rainFall 1.1s linear 0.7s infinite;
        }

        @keyframes dashFlow {
            to {
                stroke-dashoffset: -24;
            }
        }

        .route-dash {
            animation: dashFlow 1.4s linear infinite;
        }
    </style>
</head>

<body>
    <div class="app-shell flex flex-col pb-8" id="app">
        <!-- Top 5-Tab Navigation Bar (Adapted for Tainan Trip) -->
        <header class="sticky top-0 z-30 bg-[#F5F3EB]/95 backdrop-blur-sm pt-3 px-3 pb-2">
            <nav aria-label="主導覽列"
                class="bg-white border-2 border-[#222222] rounded-[22px] p-1.5 grid grid-cols-5 gap-1">
                <button onclick="switchTab('home')" data-tab="home"
                    class="nav-tab hb-btn flex flex-col items-center justify-center py-1.5 px-1 rounded-[15px] border-2 border-transparent">
                    <svg class="w-5 h-5 mb-0.5" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path
                            d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41">
                        </path>
                    </svg>
                    <span class="text-[11px] font-black leading-none tracking-tight">首頁</span>
                </button>

                <button onclick="switchTab('itinerary')" data-tab="itinerary"
                    class="nav-tab hb-btn flex flex-col items-center justify-center py-1.5 px-1 rounded-[15px] border-2 border-transparent">
                    <svg class="w-5 h-5 mb-0.5" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="18" rx="3"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                    <span class="text-[11px] font-black leading-none tracking-tight">行程</span>
                </button>

                <button onclick="switchTab('spots')" data-tab="spots"
                    class="nav-tab hb-btn flex flex-col items-center justify-center py-1.5 px-1 rounded-[15px] border-2 border-transparent">
                    <svg class="w-5 h-5 mb-0.5" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M4 11h16a1 1 0 0 1 1 1v.5a7.5 7.5 0 0 1-7.5 7.5h-3A7.5 7.5 0 0 1 3 12.5V12a1 1 0 0 1 1-1z">
                        </path>
                        <path d="M8 7c0-1 1-1.5 1-2.5S8 3 8 3"></path>
                        <path d="M12 7c0-1 1-1.5 1-2.5S12 3 12 3"></path>
                        <path d="M16 7c0-1 1-1.5 1-2.5S16 3 16 3"></path>
                    </svg>
                    <span class="text-[11px] font-black leading-none tracking-tight">美食/備案</span>
                </button>

                <button onclick="switchTab('checklist')" data-tab="checklist"
                    class="nav-tab hb-btn flex flex-col items-center justify-center py-1.5 px-1 rounded-[15px] border-2 border-transparent">
                    <svg class="w-5 h-5 mb-0.5" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="4" y="4" width="16" height="16" rx="3"></rect>
                        <polyline points="9 12 11 14 15 10"></polyline>
                    </svg>
                    <span class="text-[11px] font-black leading-none tracking-tight">清單</span>
                </button>

                <button onclick="switchTab('info')" data-tab="info"
                    class="nav-tab hb-btn flex flex-col items-center justify-center py-1.5 px-1 rounded-[15px] border-2 border-transparent">
                    <svg class="w-5 h-5 mb-0.5" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9"></circle>
                        <line x1="12" y1="16" x2="12" y2="12"></line>
                        <line x1="12" y1="8" x2="12.01" y2="8"></line>
                    </svg>
                    <span class="text-[11px] font-black leading-none tracking-tight">住宿/車況</span>
                </button>
            </nav>
        </header>

        <!-- Main Content Container -->
        <main id="main-content" class="px-3.5 pt-1 flex-1 space-y-4"></main>

        <!-- Toast Notification Banner -->
        <div id="toast"
            class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-all duration-200 translate-y-2">
            <div
                class="bg-[#222222] text-white border-2 border-white px-4 py-2 rounded-full text-xs font-bold shadow-lg flex items-center gap-2 whitespace-nowrap">
                <span id="toast-icon">✅</span>
                <span id="toast-text">已複製到剪貼簿</span>
            </div>
        </div>

                <!-- Edit Trip Modal -->
        <div id="edit-modal"
            class="fixed inset-0 z-50 bg-black/40 backdrop-blur-[1px] hidden items-center justify-center p-4">
            <div class="bg-white border-2 border-[#222222] rounded-[24px] w-full max-w-[390px] p-5 space-y-4">
                <div class="flex items-center justify-between">
                    <h3 class="text-lg font-black flex items-center gap-1.5">✏️ 編輯旅遊手帳資訊</h3>
                    <button onclick="closeEditModal()"
                        class="w-8 h-8 rounded-full border-2 border-[#222222] flex items-center justify-center font-black text-sm hb-btn">✕</button>
                </div>
                <div class="space-y-3 text-xs font-bold">
                    <div>
                        <label class="block mb-1 text-[#555555]">旅遊標題</label>
                        <input id="edit-title" type="text"
                            class="w-full border-2 border-[#222222] rounded-xl px-3 py-2 text-sm font-bold focus:outline-none focus:bg-[#FFFDF5]" />
                    </div>
                    <div>
                        <label class="block mb-1 text-[#555555]">日期副標題</label>
                        <input id="edit-subtitle" type="text"
                            class="w-full border-2 border-[#222222] rounded-xl px-3 py-2 text-sm font-bold focus:outline-none focus:bg-[#FFFDF5]" />
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block mb-1 text-[#555555]">地區標籤</label>
                            <input id="edit-regions" type="text"
                                class="w-full border-2 border-[#222222] rounded-xl px-3 py-2 text-xs font-bold focus:outline-none focus:bg-[#FFFDF5]" />
                        </div>
                        <div>
                            <label class="block mb-1 text-[#555555]">成員標籤</label>
                            <input id="edit-travelers" type="text"
                                class="w-full border-2 border-[#222222] rounded-xl px-3 py-2 text-xs font-bold focus:outline-none focus:bg-[#FFFDF5]" />
                        </div>
                    </div>
                    <div>
                        <label class="block mb-1 text-[#555555]">個人備忘錄（顯示於首頁）</label>
                        <input id="edit-memo" type="text"
                            class="w-full border-2 border-[#222222] rounded-xl px-3 py-2 text-xs font-bold focus:outline-none focus:bg-[#FFFDF5]" />
                    </div>
                </div>
                <div class="flex gap-2 pt-1">
                    <button onclick="resetTripMeta()"
                        class="flex-1 py-2.5 rounded-xl border-2 border-[#222222] bg-[#F5F3EB] text-xs font-black hb-btn">恢復預設</button>
                    <button onclick="saveTripMeta()"
                        class="flex-1 py-2.5 rounded-xl border-2 border-[#222222] bg-[#F6D365] text-xs font-black hb-btn">儲存變更</button>
                </div>
            </div>
        </div>

        <!-- Add Place of Interest Modal -->
        <div id="add-spot-modal"
            class="fixed inset-0 z-50 bg-black/40 backdrop-blur-[1px] hidden items-center justify-center p-4">
            <div class="bg-white border-2 border-[#222222] rounded-[24px] w-full max-w-[390px] max-h-[90vh] overflow-y-auto no-scrollbar p-5 space-y-3.5">
                <div class="flex items-center justify-between">
                    <h3 class="text-lg font-black flex items-center gap-1.5">➕ 新增想去的地點</h3>
                    <button onclick="closeAddSpotModal()"
                        class="w-8 h-8 rounded-full border-2 border-[#222222] flex items-center justify-center font-black text-sm hb-btn">✕</button>
                </div>
                <div class="space-y-2.5 text-xs font-bold">
                    <div>
                        <label class="block mb-1 text-[#555555]">地點名稱 <span class="text-red-500">*</span></label>
                        <input id="new-spot-name" type="text" placeholder="例：文章牛肉湯、林百貨、觀夕平台"
                            class="w-full border-2 border-[#222222] rounded-xl px-3 py-2 text-xs font-bold focus:outline-none focus:bg-[#FFFDF5]" />
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block mb-1 text-[#555555]">分類類型</label>
                            <select id="new-spot-category"
                                class="w-full border-2 border-[#222222] rounded-xl px-2.5 py-2 text-xs font-bold bg-white focus:outline-none">
                                <option value="food">🍜 美食小吃</option>
                                <option value="spot">⛩️ 景點古蹟</option>
                                <option value="cafe">☕ 甜點咖啡</option>
                                <option value="shopping">🛍️ 伴手禮購物</option>
                                <option value="hotel">🏨 住宿/放行李</option>
                                <option value="transport">🛵 租車交通</option>
                            </select>
                        </div>
                        <div>
                            <label class="block mb-1 text-[#555555]">所在區域</label>
                            <select id="new-spot-district"
                                class="w-full border-2 border-[#222222] rounded-xl px-2.5 py-2 text-xs font-bold bg-white focus:outline-none">
                                <option value="北區">北區 (近轉運站)</option>
                                <option value="中西區">中西區 (國華街/赤崁)</option>
                                <option value="安平區">安平區 (老街/海邊)</option>
                                <option value="東區">東區</option>
                                <option value="南區">南區</option>
                                <option value="其它">其它區域</option>
                            </select>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block mb-1 text-[#555555]">營業/開放時間</label>
                            <input id="new-spot-hours" type="text" placeholder="例：10:00 - 21:00 或 24H"
                                class="w-full border-2 border-[#222222] rounded-xl px-3 py-2 text-xs font-bold focus:outline-none focus:bg-[#FFFDF5]" />
                        </div>
                        <div>
                            <label class="block mb-1 text-[#555555]">預計停留時間</label>
                            <input id="new-spot-stay" type="text" placeholder="例：45分鐘 或 1小時"
                                class="w-full border-2 border-[#222222] rounded-xl px-3 py-2 text-xs font-bold focus:outline-none focus:bg-[#FFFDF5]" />
                        </div>
                    </div>
                    <div>
                        <label class="block mb-1 text-[#555555]">推薦特色／必吃小撇步</label>
                        <input id="new-spot-tip" type="text" placeholder="例：必點招牌牛肉湯、二樓看夕陽"
                            class="w-full border-2 border-[#222222] rounded-xl px-3 py-2 text-xs font-bold focus:outline-none focus:bg-[#FFFDF5]" />
                    </div>
                    <div>
                        <label class="block mb-1 text-[#555555]">雨天／人潮備案</label>
                        <input id="new-spot-backup" type="text" placeholder="例：若排隊超過20分鐘改去二店或咖啡店"
                            class="w-full border-2 border-[#222222] rounded-xl px-3 py-2 text-xs font-bold focus:outline-none focus:bg-[#FFFDF5]" />
                    </div>
                    <div>
                        <label class="block mb-1 text-[#555555]">加入至哪個行程時段？</label>
                        <select id="new-spot-target-slot"
                            class="w-full border-2 border-[#222222] rounded-xl px-2.5 py-2 text-xs font-bold bg-[#FFFDF5] focus:outline-none">
                            <option value="saved">⭐ 僅存入口袋名單（隨時挑選）</option>
                            <option value="am1">☀️ Day 1 早上行程</option>
                            <option value="pm1">🌊 Day 1 下午行程</option>
                            <option value="day2">🗓️ Day 2 行程</option>
                        </select>
                    </div>
                </div>
                <div class="flex gap-2 pt-1">
                    <button onclick="closeAddSpotModal()"
                        class="flex-1 py-2.5 rounded-xl border-2 border-[#222222] bg-[#F5F3EB] text-xs font-black hb-btn">取消</button>
                    <button onclick="saveNewSpot()"
                        class="flex-1 py-2.5 rounded-xl border-2 border-[#222222] bg-[#F6D365] text-xs font-black hb-btn">儲存地點</button>
                </div>
            </div>
        </div>

        <!-- Smart Route Optimization Modal -->
        <div id="optimize-modal"
            class="fixed inset-0 z-50 bg-black/40 backdrop-blur-[1px] hidden items-center justify-center p-4">
            <div class="bg-white border-2 border-[#222222] rounded-[24px] w-full max-w-[390px] max-h-[90vh] overflow-y-auto no-scrollbar p-5 space-y-4">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-1.5">
                        <span class="text-xl">✨</span>
                        <h3 class="text-lg font-black text-[#222222]">智慧最佳遊玩順序</h3>
                    </div>
                    <button onclick="closeOptimizeModal()"
                        class="w-8 h-8 rounded-full border-2 border-[#222222] flex items-center justify-center font-black text-sm hb-btn">✕</button>
                </div>

                <div id="optimize-summary-box" class="bg-[#FFF9E6] border-2 border-[#222222] rounded-2xl p-3.5 space-y-2 text-xs">
                    <!-- Injected dynamically: logic reasons & estimated time savings -->
                </div>

                <div class="space-y-2">
                    <div class="flex items-center justify-between text-xs font-black text-[#555555]">
                        <span>📋 建議最佳遊玩路線</span>
                        <span class="text-[11px] bg-[#E3EFE0] hb-pill px-2 py-0.5 text-[#222222]">順向動線・省時</span>
                    </div>
                    <div id="optimize-preview-list" class="space-y-1.5 text-xs font-bold max-h-56 overflow-y-auto no-scrollbar">
                        <!-- Injected dynamically: preview cards with sequence arrows -->
                    </div>
                </div>

                <div class="flex gap-2 pt-1">
                    <button onclick="closeOptimizeModal()"
                        class="flex-1 py-2.5 rounded-xl border-2 border-[#222222] bg-[#F5F3EB] text-xs font-black hb-btn">保持原順序</button>
                    <button onclick="applyOptimizedOrder()"
                        class="flex-1 py-2.5 rounded-xl border-2 border-[#222222] bg-[#F6D365] text-xs font-black hb-btn flex items-center justify-center gap-1">
                        <span>✅</span>
                        <span>套用此順序</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Stop Expense Modal -->
        <div id="stop-expense-modal"
            class="fixed inset-0 z-50 bg-black/40 backdrop-blur-[1px] hidden items-center justify-center p-4">
            <div class="bg-white border-2 border-[#222222] rounded-[24px] w-full max-w-[390px] max-h-[90vh] overflow-y-auto no-scrollbar p-5 space-y-4">
                <div class="flex items-center justify-between">
                    <div>
                        <div class="text-[11px] font-black text-[#888888]">景點簡單記帳</div>
                        <h3 id="stop-expense-title" class="text-base font-black text-[#222222] leading-tight line-clamp-1"></h3>
                    </div>
                    <button onclick="closeStopExpenseModal()"
                        class="w-8 h-8 rounded-full border-2 border-[#222222] flex items-center justify-center font-black text-sm hb-btn">✕</button>
                </div>

                <!-- Spot Current Total Badge -->
                <div class="bg-[#F8EAE8] border-2 border-[#222222] rounded-2xl p-3 flex items-center justify-between">
                    <span class="text-xs font-black text-[#222222]">本站累積花費</span>
                    <span id="stop-expense-total-display" class="text-lg font-black text-[#222222] tabular-nums">NT$ 0</span>
                </div>

                <!-- Quick Add Form -->
                <div class="bg-[#F5F3EB] border-[1.5px] border-[#222222] rounded-2xl p-3 space-y-2.5">
                    <div class="text-xs font-black text-[#222222]">＋ 記一筆花費</div>
                    <!-- Quick Tag Chips -->
                    <div class="flex items-center gap-1 flex-wrap">
                        <button type="button" onclick="setQuickExpCategory('🥣 餐費')" class="hb-btn bg-white border border-[#222222] rounded-full px-2 py-0.5 text-[10px] font-black">🥣 餐費</button>
                        <button type="button" onclick="setQuickExpCategory('🥤 飲料甜點')" class="hb-btn bg-white border border-[#222222] rounded-full px-2 py-0.5 text-[10px] font-black">🥤 飲料甜點</button>
                        <button type="button" onclick="setQuickExpCategory('🛵 租車交通')" class="hb-btn bg-white border border-[#222222] rounded-full px-2 py-0.5 text-[10px] font-black">🛵 租車交通</button>
                        <button type="button" onclick="setQuickExpCategory('🎫 門票')" class="hb-btn bg-white border border-[#222222] rounded-full px-2 py-0.5 text-[10px] font-black">🎫 門票</button>

        let toastTimer = null;
        function showToast(text, icon = '✅') {
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').textContent = text;
            document.getElementById('toast-icon').textContent = icon;
            toast.classList.remove('opacity-0', 'translate-y-2');
            toast.classList.add('opacity-100', 'translate-y-0');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                toast.classList.remove('opacity-100', 'translate-y-0');
            }, 2100);
        }

        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function openGoogleMaps(query) {
            const url = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
            window.open(url, '_blank', 'noopener,noreferrer');
        }

            const list = getStopExpenses(stopId);
            return list.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
        }

        function getGrandTotalExpense() {
            let total = 0;
            let count = 0;
            const byCategory = {
                food: 0,
                transport: 0,
                hotel: 0,
                ticket: 0,
                shopping: 0,
                other: 0
            };

            Object.entries(state.expenses).forEach(([stopId, list]) => {
                if (Array.isArray(list)) {
                    list.forEach(item => {
                        const amt = Number(item.amount) || 0;
                        total += amt;
                        count++;
                        const cat = item.category || 'other';
                        if (byCategory[cat] !== undefined) {
                            byCategory[cat] += amt;
                        } else {
                            byCategory.other += amt;
                        }
                    });
                }
            });

            return {
                total,
                count,
                perPerson: Math.round(total / 2),
                byCategory
            };
        }

            let cat = 'other';
            if (title.includes('餐') || title.includes('湯') || title.includes('吃') || title.includes('飯') || title.includes('肉') || title.includes('麵') || title.includes('豆花') || title.includes('食') || title.includes('茶') || title.includes('甜點')) {
                cat = 'food';
            } else if (title.includes('車') || title.includes('油') || title.includes('停') || title.includes('租') || title.includes('票') || title.includes('高鐵')) {
                cat = 'transport';
            } else if (title.includes('住') || title.includes('房') || title.includes('寓所') || title.includes('飯店')) {
                cat = 'hotel';

                amount,
                category: cat,
                time: new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' })

        // ==========================================
        // 4. SMART ROUTE OPTIMIZATION (重點功能 2)
        // ==========================================
        let optimizedPreviewItems = [];

        function calculateItemScore(item, slotKey) {
            const title = (item.title || '') + ' ' + (item.desc || '') + ' ' + (item.tags || []).join(' ');
            const district = item.district || inferDistrict(title);
            const hours = item.openHours || inferOpenHours(title);

            let score = 50;

            // 1. Mandatory anchor priorities
            if (title.includes('停車') || title.includes('抵達')) return -100;
            if (title.includes('早餐') || title.includes('牛肉湯')) score = -40;
            if (title.includes('廟宇') || title.includes('玉皇宮') || title.includes('參拜')) score = -30;
            if (title.includes('租機車') || title.includes('租車')) score = -15;
            if (title.includes('廣發寓所') || title.includes('放行李') || item.category === 'hotel') score = -5;
            if (title.includes('去安平') || title.includes('前往安平')) score = 10;
            if (title.includes('夕陽') || title.includes('觀夕') || title.includes('日落')) score = 80;
            if (title.includes('夜市') || title.includes('宵夜') || title.includes('酒吧')) score = 95;
            if (title.includes('還車') || title.includes('取車返程') || title.includes('返程')) return 100;

            // 2. District progression
            if (slotKey === 'am1') {
                if (district === '北區') score -= 20;
                else if (district === '中西區') score += 5;
                else if (district === '安平區') score += 30;
            } else if (slotKey === 'pm1') {
                if (district === '安平區') {
                    if (title.includes('夕陽') || title.includes('海邊')) score += 20;
                    else score -= 10;
                } else if (district === '中西區') {
                    score += 25;
                }
            } else if (slotKey === 'day2') {
                if (district === '中西區') score -= 15;
                if (title.includes('伴手禮')) score += 10;
                if (district === '北區') score += 30;
            }

            // 3. Opening hours logic
            if (hours.includes('04:') || hours.includes('05:') || hours.includes('06:') || hours.includes('早市')) {
                score -= 30;
            } else if (hours.includes('16:') || hours.includes('17:') || hours.includes('夕陽')) {
                score += 25;
            } else if (hours.includes('18:') || hours.includes('19:') || hours.includes('夜市')) {
                score += 40;
            }

            return score;
        }

        function inferDistrict(text) {
            if (text.includes('安平') || text.includes('觀夕') || text.includes('億載')) return '安平區';
            if (text.includes('赤崁') || text.includes('國華') || text.includes('神農') || text.includes('廣發') || text.includes('孔廟') || text.includes('林百貨')) return '中西區';
            if (text.includes('轉運站') || text.includes('玉皇宮') || text.includes('西羅殿') || text.includes('無名豆花') || text.includes('見昌')) return '北區';
            return '中西區';
        }

        function inferOpenHours(text) {
            if (text.includes('早餐') || text.includes('西羅殿')) return '04:30 - 13:00';
            if (text.includes('夕陽') || text.includes('觀夕')) return '16:30 - 17:40';
            if (text.includes('夜市')) return '18:00 - 23:30';
            return '10:00 - 19:00';
        }

        <!-- Timeline Cards -->
        <div class="space-y-3">
          ${slot.items.length === 0 ? `
            <div class="hb-card p-6 text-center space-y-2">
              <div class="text-2xl">🗺️</div>
              <div class="text-xs font-black text-[#555555]">這個時段目前沒有排定的站點</div>
              <button onclick="openPickSpotModal('${state.selectedSlot}')" class="hb-btn bg-[#F6D365] hb-pill px-3 py-1 text-xs font-black">
                ＋ 從口袋名單挑選加入
              </button>
            </div>
          ` : slot.items.map((item, idx) => {
                const checked = !!state.checkedStops[item.id];
                const noteVal = state.stopNotes[item.id] || '';
                const stopTotal = getStopTotalExpense(item.id);
                const stopExpenseCount = getStopExpenses(item.id).length;

                return `
              <div class="hb-card p-3.5 space-y-2.5 transition ${checked ? 'opacity-65 bg-[#FAF8F2]' : 'bg-white'}">
                <div class="flex items-center justify-between gap-2">
                  <div class="flex items-center gap-2">
                    <button onclick="toggleStopDone('${item.id}')" class="hb-btn w-6 h-6 rounded-full border-2 border-[#222222] flex items-center justify-center text-xs font-black ${checked ? 'bg-[#E3EFE0]' : 'bg-white'}">
                      ${checked ? '✓' : ''}
                    </button>
                    <span class="bg-[#222222] text-white rounded-full px-2.5 py-0.5 text-xs font-black">
                      ${item.time}
                    </span>
                  </div>
                  <div class="flex items-center gap-1.5">
                    <!-- Move Up / Down Buttons -->
                    <button onclick="moveItemUp('${state.selectedSlot}', ${idx})" title="上移" class="w-6 h-6 rounded-lg border border-[#222222] flex items-center justify-center text-[10px] font-black bg-white hb-btn ${idx === 0 ? 'opacity-30 cursor-not-allowed' : ''}">
                      ▲
                    </button>
                    <button onclick="moveItemDown('${state.selectedSlot}', ${idx})" title="下移" class="w-6 h-6 rounded-lg border border-[#222222] flex items-center justify-center text-[10px] font-black bg-white hb-btn ${idx === slot.items.length - 1 ? 'opacity-30 cursor-not-allowed' : ''}">
                      ▼
                    </button>
                    <button onclick="openGoogleMaps('${item.mapQuery.replace(/'/g, "\\'")}')" class="hb-btn bg-[#F6D365] hb-pill px-2 py-0.5 text-[11px] font-black flex items-center gap-1">
                      <span>📍</span>
                      <span>導航</span>
                    </button>
                  </div>
                </div>

                <div class="flex items-start justify-between gap-2">
                  <h3 class="text-[15px] font-black text-[#222222] leading-snug ${checked ? 'line-through text-[#666666]' : ''}">
                    ${item.title}
                  </h3>
                  <button onclick="deleteItineraryItem('${state.selectedSlot}', ${idx})" title="從行程移除" class="text-xs text-[#999999] hover:text-red-500 font-bold p-1 hb-btn">
                    🗑️
                  </button>
                </div>

                <p class="text-xs font-bold text-[#555555] leading-relaxed">
                  ${item.desc}
                </p>

                <div class="flex items-center gap-1.5 flex-wrap">
                  ${(item.tags || []).map(t => `
                    <span class="bg-[#F5F3EB] hb-pill px-2.5 py-0.5 text-[10px] font-black">${t}</span>
                  `).join('')}
                </div>

                ${item.backup ? `
                  <div class="bg-[#F8EAE8]/80 rounded-xl px-2.5 py-1.5 text-[11px] font-bold text-[#222222]">
                    💡 ${item.backup}
                  </div>
                ` : ''}

                <!-- Spot Expense Section (重點功能 3) -->
                <div class="flex items-center justify-between bg-[#FFFDF5] border-[1.5px] border-[#222222]/30 rounded-xl px-3 py-2">
                  <div class="flex items-center gap-1.5">
                    <span class="text-xs">💰</span>
                    <span class="text-xs font-black text-[#222222]">
                      ${stopTotal > 0 ? `花費：NT$ ${stopTotal.toLocaleString()}` : '尚未記帳'}
                    </span>
                    ${stopExpenseCount > 0 ? `<span class="text-[10px] bg-[#E3EFE0] px-1.5 py-0.5 rounded-full font-bold">(${stopExpenseCount}筆)</span>` : ''}
                  </div>
                  <button onclick="openStopExpenseModal('${item.id}', '${escapeHtml(item.title)}')" class="hb-btn bg-[#F6D365] hb-pill px-2.5 py-1 text-[11px] font-black flex items-center gap-1">
                    <span>${stopTotal > 0 ? '✏️ 明細/加記' : '＋ 記帳'}</span>
                  </button>
                </div>

                <!-- Personal Note Input per Stop -->
                <div>
                  <input type="text" value="${escapeHtml(noteVal)}" placeholder="✏️ 寫下現場筆記（如：車格號碼、還車時間、必點品項）" onchange="updateStopNote('${item.id}', this.value)" class="w-full text-[11px] font-bold bg-[#F5F3EB] border-[1.5px] border-[#222222]/40 rounded-xl px-2.5 py-1.5 focus:outline-none focus:border-[#222222]" />
                </div>
              </div>
            `;
            }).join('')}
        </div>

        <!-- Add Custom Spot Button at bottom of timeline -->
        <div class="pt-1">
          <button onclick="openAddSpotModal('${state.selectedSlot}')" class="w-full py-3 rounded-2xl border-2 border-[#222222] bg-[#F5F3EB] text-xs font-black flex items-center justify-center gap-1.5 hb-btn shadow-[0_2px_0_#222222]">
            <span>➕</span>
            <span>新增此時段新景點</span>
          </button>
        </div>
      `;
        }

        function renderSpotsTab() {
            const filter = state.spotFilter || 'all';

            const filteredSpots = state.savedSpots.filter(s => {
                if (filter === 'all') return true;
                if (filter === 'custom') return !!s.isCustom;
                return s.category === filter;
            });

            return `
        <div class="flex items-center justify-between pt-1">
          <div>
            <h1 class="text-2xl font-black text-[#222222]">景點與口袋名單</h1>
            <p class="text-[11px] font-bold text-[#666666]">收藏台南想去的特色地點</p>
          </div>
          <button onclick="openAddSpotModal('saved')" class="hb-btn bg-[#F6D365] border-2 border-[#222222] rounded-full px-3 py-1.5 text-xs font-black flex items-center gap-1 shadow-[0_2px_0_#222222]">
            <span>➕</span>
            <span>新增想去地點</span>
          </button>
        </div>

        <!-- Category Filters -->
        <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1">
          ${[
                { id: 'all', label: '全部' },
                { id: 'food', label: '🍜 美食' },
                { id: 'spot', label: '⛩️ 景點' },
                { id: 'cafe', label: '☕ 咖啡甜點' },
                { id: 'custom', label: '⭐ 我的收藏' }
            ].map(f => `
            <button onclick="filterSpots('${f.id}')" class="hb-btn px-3 py-1 rounded-full border-[1.5px] border-[#222222] text-xs font-black whitespace-nowrap ${filter === f.id ? 'bg-[#222222] text-white' : 'bg-white text-[#222222]'}">
              ${f.label}
            </button>
          `).join('')}
        </div>

        <!-- Spots List -->
        <div class="space-y-3">
          ${filteredSpots.length === 0 ? `
            <div class="hb-card p-8 text-center space-y-3">
              <div class="text-3xl">📌</div>
              <div class="text-xs font-black text-[#555555]">沒有符合此分類的地點</div>
              <button onclick="openAddSpotModal('saved')" class="hb-btn bg-[#F6D365] hb-pill px-4 py-1.5 text-xs font-black">
                ＋ 新增想去的地點
              </button>
            </div>
          ` : filteredSpots.map(s => `
            <div class="hb-card p-3.5 space-y-2.5">
              <div class="flex items-center justify-between gap-2">
                <div class="flex items-center gap-1.5 flex-wrap">
                  <span class="hb-pill px-2.5 py-0.5 text-[11px] font-black" style="background-color: ${s.color};">${s.tag}</span>
                  <span class="bg-[#F5F3EB] hb-pill px-2 py-0.5 text-[10px] font-black text-[#555555]">📍 ${s.district}</span>
                  ${s.isCustom ? `<span class="bg-[#F6D365]/60 text-[9px] font-black px-1.5 py-0.5 rounded-full">自訂</span>` : ''}
                </div>
                <div class="flex items-center gap-1">
                  <button onclick="openGoogleMaps('${s.mapQuery.replace(/'/g, "\\'")}')" class="hb-btn bg-[#F5F3EB] hb-pill px-2.5 py-1 text-[11px] font-black">
                    導航 ➔
                  </button>
                  ${s.isCustom ? `
                    <button onclick="deleteCustomSpot('${s.id}')" title="刪除此收藏" class="text-xs text-[#999999] hover:text-red-500 font-black p-1 hb-btn">
                      ✕
                    </button>
                  ` : ''}
                </div>
              </div>

              <h3 class="text-base font-black text-[#222222]">${s.name}</h3>

              <div class="text-[11px] text-[#666666] font-bold flex items-center gap-3">
                <span>⏰ 營業時間：${s.openHours}</span>
                <span>⏱️ 建議停留：${s.stayMin || '45分鐘'}</span>
              </div>

              <p class="text-xs font-bold text-[#555555] leading-relaxed">${s.tip}</p>

              ${s.backup ? `
                <div class="bg-[#F5F3EB] rounded-xl p-2 text-[11px] font-bold text-[#222222]">
                  🔄 ${s.backup}
                </div>
              ` : ''}

              <!-- Add to Schedule Action Strip -->
              <div class="pt-1 flex items-center justify-between border-t border-dashed border-[#222222]/20 text-xs">
                <span class="text-[11px] font-bold text-[#666666]">加入行程時段：</span>
                <div class="flex items-center gap-1.5">
                  <button onclick="addSavedSpotToSlot('${s.id}', 'am1')" class="hb-btn bg-white border border-[#222222] rounded-lg px-2 py-1 text-[10px] font-black hover:bg-[#F6D365]">
                    ＋ Day 1 早上
                  </button>
                  <button onclick="addSavedSpotToSlot('${s.id}', 'pm1')" class="hb-btn bg-white border border-[#222222] rounded-lg px-2 py-1 text-[10px] font-black hover:bg-[#CBE2F6]">
                    ＋ Day 1 下午
                  </button>
                  <button onclick="addSavedSpotToSlot('${s.id}', 'day2')" class="hb-btn bg-white border border-[#222222] rounded-lg px-2 py-1 text-[10px] font-black hover:bg-[#E3EFE0]">
                    ＋ Day 2
                  </button>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
        }

        function renderChecklistTab() {
            let total = 0;
            let done = 0;
            state.checklist.forEach(c => c.items.forEach(i => {
                total++;
                if (i.done) done++;
            }));
            const pct = total > 0 ? Math.round((done / total) * 100) : 0;

            return `
        <div class="flex items-center justify-between pt-1">
          <h1 class="text-2xl font-black text-[#222222]">行前清單</h1>
          <button onclick="resetChecklist()" class="hb-btn bg-white hb-pill px-3 py-1 text-[11px] font-black">重置勾選</button>
        </div>

        <div class="hb-card p-4 bg-[#E3EFE0]">
          <div class="flex items-center justify-between text-xs font-black mb-2">
            <span>準備完成度</span>
            <span class="tabular-nums">${done} / ${total} 項 (${pct}%)</span>
          </div>
          <div class="w-full h-3 bg-white border-2 border-[#222222] rounded-full overflow-hidden">
            <div class="h-full bg-[#F6D365] transition-all duration-300" style="width: ${pct}%;"></div>
          </div>
        </div>

        <div class="hb-card p-3 flex items-center gap-2">
          <input id="new-check-input" type="text" placeholder="新增物品（如：雨衣、充電線）" class="flex-1 text-xs font-bold bg-[#F5F3EB] border-[1.5px] border-[#222222] rounded-xl px-3 py-2 focus:outline-none" onkeydown="if(event.key==='Enter') addCheckItem()" />
          <button onclick="addCheckItem()" class="hb-btn bg-[#F6D365] border-[1.5px] border-[#222222] rounded-xl px-3 py-2 text-xs font-black shrink-0">＋ 加入</button>
        </div>

        <div class="space-y-3">
          ${state.checklist.map((cat, cIdx) => `
            <div class="hb-card p-3.5 space-y-2">
              <h3 class="text-sm font-black text-[#222222] border-b-2 border-[#222222] pb-1">${cat.category}</h3>
              <div class="space-y-1.5">
                ${cat.items.map((item, iIdx) => `
                  <label class="flex items-start gap-2.5 p-2 rounded-xl border-[1.5px] ${item.done ? 'bg-[#F5F3EB] border-[#222222]/30' : 'bg-white border-[#222222]'} cursor-pointer">
                    <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleCheckItem(${cIdx}, ${iIdx})" class="mt-0.5 w-4 h-4 accent-[#222222]" />
                    <span class="text-xs font-bold flex-1 ${item.done ? 'line-through text-[#888888]' : 'text-[#222222]'}">${escapeHtml(item.text)}</span>
                  </label>
                `).join('')}
              </div>
            </div>
          `).join('')}
        </div>
      `;
        }

        function renderInfoTab() {
            return `
        <div class="flex items-center justify-between pt-1">
          <h1 class="text-2xl font-black text-[#222222]">住宿與車況</h1>
          <span class="text-[11px] font-black bg-[#E3EFE0] hb-pill px-2.5 py-1">自動儲存</span>
        </div>

        <div class="hb-card p-4 space-y-3 text-xs font-bold">
          <div>
            <div class="flex items-center justify-between mb-1">
              <label class="font-black text-[#222222]">🅿️ 車子博客停車場 - 臺南轉運站場</label>
              <button onclick="openGoogleMaps('臺南轉運站 停車場')" class="hb-btn bg-[#F5F3EB] hb-pill px-2 py-0.5 text-[10px] font-black">導航</button>
            </div>
            <input type="text" value="${escapeHtml(state.parkingInfo)}" onchange="state.parkingInfo = this.value; saveState(); showToast('已儲存停車備忘');" class="w-full bg-[#F5F3EB] border-[1.5px] border-[#222222] rounded-xl px-3 py-2 text-xs font-bold" />
          </div>

          <div>
            <div class="flex items-center justify-between mb-1">
              <label class="font-black text-[#222222]">🛵 見昌機車出租</label>
              <button onclick="openGoogleMaps('見昌租機車 台南')" class="hb-btn bg-[#F5F3EB] hb-pill px-2 py-0.5 text-[10px] font-black">導航</button>
            </div>
            <input type="text" value="${escapeHtml(state.scooterInfo)}" onchange="state.scooterInfo = this.value; saveState(); showToast('已儲存租車備忘');" class="w-full bg-[#F5F3EB] border-[1.5px] border-[#222222] rounded-xl px-3 py-2 text-xs font-bold" />
          </div>

          <div>
            <div class="flex items-center justify-between mb-1">
              <label class="font-black text-[#222222]">🏨 廣發寓所</label>
              <button onclick="openGoogleMaps('廣發寓所')" class="hb-btn bg-[#F5F3EB] hb-pill px-2 py-0.5 text-[10px] font-black">導航</button>
            </div>
            <input type="text" value="${escapeHtml(state.hotelInfo)}" onchange="state.hotelInfo = this.value; saveState(); showToast('已儲存住宿備忘');" class="w-full bg-[#F5F3EB] border-[1.5px] border-[#222222] rounded-xl px-3 py-2 text-xs font-bold" />
          </div>
        </div>
      `;
        }

        // ==========================================
        // 7. TAB & CONTROLLERS
        // ==========================================
        function switchTab(tabName) {
            state.activeTab = tabName;
            document.querySelectorAll('.nav-tab').forEach(btn => {
                const isTarget = btn.getAttribute('data-tab') === tabName;
                btn.style.backgroundColor = isTarget ? '#F6D365' : 'transparent';
                btn.style.borderColor = isTarget ? '#222222' : 'transparent';
            });
            renderCurrentTab();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderCurrentTab() {
            const container = document.getElementById('main-content');
            if (!container) return;
            switch (state.activeTab) {
                case 'home':
                    container.innerHTML = renderHomeTab();
                    updateClock();
                    break;
                case 'itinerary':
                    container.innerHTML = renderItineraryTab();
                    break;
                case 'spots':
                    container.innerHTML = renderSpotsTab();
                    break;
                case 'checklist':
                    container.innerHTML = renderChecklistTab();
                    break;
                case 'info':
                    container.innerHTML = renderInfoTab();
                    break;
            }
        }

        function toggleWeatherMode() {
            state.weatherMode = state.weatherMode === 'sunny' ? 'rainy' : 'sunny';
            saveState();
            renderCurrentTab();
            showToast(state.weatherMode === 'sunny' ? '已切換為 ☀️ 晴天模式' : '已切換為 🌧️ 雨天模式');
        }

        function selectSlot(slotKey) {
            state.selectedSlot = slotKey;
            renderCurrentTab();
        }

        function toggleStopDone(id) {
            state.checkedStops[id] = !state.checkedStops[id];
            saveState();
            renderCurrentTab();
        }

        function updateStopNote(id, val) {
            state.stopNotes[id] = val;
            saveState();
            showToast('已儲存景點筆記', '✏️');
        }

        function toggleCheckItem(cIdx, iIdx) {
            state.checklist[cIdx].items[iIdx].done = !state.checklist[cIdx].items[iIdx].done;
            saveState();
            renderCurrentTab();
        }

        function addCheckItem() {
            const input = document.getElementById('new-check-input');
            const val = input ? input.value.trim() : '';
            if (!val) return;
            state.checklist[0].items.unshift({ id: 'c_' + Date.now(), text: val, done: false });
            saveState();
            renderCurrentTab();
            showToast('已加入清單');
        }

        function resetChecklist() {
            state.checklist = JSON.parse(JSON.stringify(DEFAULT_CHECKLIST));
            saveState();
            renderCurrentTab();
            showToast('已重置清單');
        }

        function openEditModal() {
            document.getElementById('edit-title').value = state.tripMeta.title;
            document.getElementById('edit-subtitle').value = state.tripMeta.subtitle;
            document.getElementById('edit-regions').value = state.tripMeta.regions;
            document.getElementById('edit-travelers').value = state.tripMeta.travelers;
            document.getElementById('edit-memo').value = state.tripMeta.memo || '';
            const modal = document.getElementById('edit-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeEditModal() {
            const modal = document.getElementById('edit-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function saveTripMeta() {
            state.tripMeta = {
                title: document.getElementById('edit-title').value.trim() || DEFAULT_META.title,
                subtitle: document.getElementById('edit-subtitle').value.trim() || DEFAULT_META.subtitle,
                regions: document.getElementById('edit-regions').value.trim() || DEFAULT_META.regions,
                travelers: document.getElementById('edit-travelers').value.trim() || DEFAULT_META.travelers,
                memo: document.getElementById('edit-memo').value.trim()
            };
            saveState();
            closeEditModal();
            renderCurrentTab();
            showToast('已更新旅遊手帳資訊');
        }

        function resetTripMeta() {
            state.tripMeta = { ...DEFAULT_META };
            saveState();
            closeEditModal();
            renderCurrentTab();
            showToast('已恢復預設設定');
        }

        window.onload = function () {
            switchTab('home');
            setInterval(updateClock, 1000);
        };
    </script>
</body>

</html>
